# Site settings — update with your own info
title: "Ender Kuş"
tagline: "Short title/description (e.g. Software Engineer. Creator of X.)"
description: "Short title/description (e.g. Software Engineer. Creator of X.)"
email: "ender@enderkus.com.tr"
author: "Ender Kuş"

# This demo is published as a project site (github.com/enderkus/jekyll-theme-colophon),
# so it's served under a /jekyll-theme-colophon/ subpath — hence the baseurl below.
# For your own blog on a user/org site (username.github.io) or a custom domain,
# set baseurl back to "" and drop the path from url.
url: "https://enderkus.github.io"
baseurl: "/jekyll-theme-colophon"

# Social links — leave blank if unused, the include hides it automatically
social:
  twitter: ""
  linkedin: ""
  github: "enderkus"
  website: ""
  website_label: ""

# ConvertKit subscription form
# Create your form in ConvertKit under Grow > Landing Pages & Forms,
# grab it as "Embed" > "Formatted HTML", and paste the form ID here.
convertkit:
  form_id: "XXXXXXX"

permalink: /:title/

# Pulls in layouts, includes and default assets from the jekyll-theme-colophon gem.
# See ../README.md for how this gem dependency is wired up in this demo's Gemfile.
theme: jekyll-theme-colophon

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
